<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>games · 小游戏与小工具合集</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3b;
    --text: #e8eaf0;
    --muted: #8a91a0;
    --accent: #6f8cff;
    --green: #3ddc84;
    --amber: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  header h1 {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(135deg, #6f8cff, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: transform .15s, border-color .15s;
    display: block;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card .icon { font-size: 28px; margin-bottom: 10px; }
  .card h3 { font-size: 17px; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 10px;
    background: rgba(111,140,255,.15);
    color: var(--accent);
  }
  .tag.green { background: rgba(61,220,132,.15); color: var(--green); }
  .tag.amber { background: rgba(255,180,84,.15); color: var(--amber); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 48px;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>games</h1>
    <p>个人小游戏与小工具合集 · 单文件、零依赖、开箱即用</p>
  </header>

  <div class="grid">
    <a class="card" href="ant-blocks.html">
      <div class="icon">🐜</div>
      <h3>蚂蚁搬方块</h3>
      <p>搬运/消除类小游戏，双击即玩。</p>
      <span class="tag green">小游戏</span>
    </a>

    <a class="card" href="block-puzzle-ocean.html">
      <div class="icon">🌊</div>
      <h3>方块拼图 · 海洋历险</h3>
      <p>9×9 拖拽消除 + 像素画闯关，本地存档。</p>
      <span class="tag green">小游戏</span>
    </a>

    <a class="card" href="family-memory.html">
      <div class="icon">🗂️</div>
      <h3>家庭物品位置备忘</h3>
      <p>门禁钥匙、充电宝… 放哪了？录入位置一键查找。</p>
      <span class="tag">工具</span>
    </a>

    <a class="card" href="https://github.com/hebugui/games/tree/master/video-translator">
      <div class="icon">🎬</div>
      <h3>视频实时翻译</h3>
      <p>Edge 视频实时翻译：扬声器音频识别 + 字幕叠加。</p>
      <span class="tag amber">工具</span>
    </a>
  </div>

  <footer>
    源码见 <a href="https://github.com/hebugui/games">github.com/hebugui/games</a>
  </footer>
</div>
</body>
</html>
